name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Tillat at workflow-en publiserer til GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Kun én Pages-deploy om gangen; avbryt ikke en pågående produksjons-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Kjører tsc --noEmit + vite build + schema-validering.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
